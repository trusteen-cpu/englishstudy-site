<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Study · 영어 공부</title>
<meta name="description" content="매일 조금씩, 소리 내어 읽고 말하며 익히는 영어 공부">
<meta property="og:title" content="English Study · 영어 공부">
<meta property="og:description" content="매일 조금씩, 소리 내어 읽고 말하며 익히는 영어 공부">
<style>
  :root{--bg:#f6f3ec;--card:#fffdf8;--ink:#2a2622;--sub:#857a6d;--brand:#1f3a5f;--gold:#c8902e;--line:#e4dccd}
  *{box-sizing:border-box}html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.7;word-break:keep-all}
  header{background:linear-gradient(135deg,#1f3a5f,#2f5d8a 60%,#c8902e);color:#fff;text-align:center;padding:72px 20px 56px}
  header h1{margin:0;font-size:40px;letter-spacing:1px}
  header p{margin:10px 0 0;font-size:17px;opacity:.92}
  main{max-width:880px;margin:-28px auto 40px;padding:0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
  .card h2{margin:0 0 6px;font-size:18px;color:var(--brand)}
  .card p{margin:0;color:var(--sub);font-size:15px}
  .soon{display:inline-block;margin-top:10px;font-size:12px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:1px 10px}
  .note{margin:26px 0 0;text-align:center;color:var(--sub);font-size:14px}
  footer{text-align:center;color:var(--sub);font-size:13px;padding:20px 0 30px}
</style>
</head>
<body>
<header>
  <h1>English Study</h1>
  <p>매일 조금씩, 소리 내어 읽고 말하며 익히는 영어</p>
</header>
<main>
  <div class="grid">
    <section class="card"><h2>오늘의 문장</h2><p>하루 한 문장을 듣고, 따라 읽고, 내 말로 바꿔 봅니다.</p><span class="soon">준비 중</span></section>
    <section class="card"><h2>단어와 표현</h2><p>문장 속에서 만나는 단어를 뜻과 쓰임으로 익힙니다.</p><span class="soon">준비 중</span></section>
    <section class="card"><h2>말하기 연습</h2><p>질문에 영어로 답해 보고, 더 자연스러운 표현을 배웁니다.</p><span class="soon">준비 중</span></section>
  </div>
  <p class="note">새 코너를 하나씩 채워 가는 중입니다.</p>
</main>
<footer>© englishstudy.kr</footer>
</body>
</html>
