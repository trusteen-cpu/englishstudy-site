<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta property="og:title" content="마스터 영어">
<meta property="og:description" content="초대장 한 장으로 영어의 방에 — 듣기·말하기·읽기·쓰기 교재">
<title>마스터 영어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
[hidden]{display:none!important}
body{margin:0}
:root{
  --ground:#EEF1EC; --paper:#FBFCF9; --ink:#16241F; --ink-2:#4A5A53; --ink-3:#7F8C86;
  --line:#CBD4CE; --perf:#B7C2BB; --mark:#F2D23C; --mark-soft:rgba(242,210,60,.55);
  --stamp:#D8573C; --stamp-ink:#FFFFFF; --focus:#2F6B57; --shadow:0 1px 0 rgba(22,36,31,.06),0 10px 24px -14px rgba(22,36,31,.28);
  --serif:"Nanum Myeongjo","Batang","AppleMyungjo",serif;
  --sans:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#111916; --paper:#18221E; --ink:#E6EDE8; --ink-2:#AFBDB6; --ink-3:#7E8D86;
    --line:#2B3833; --perf:#3A4843; --mark:#E7C735; --mark-soft:rgba(231,199,53,.32);
    --stamp:#E0694F; --focus:#8FD0B5; --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#111916; --paper:#18221E; --ink:#E6EDE8; --ink-2:#AFBDB6; --ink-3:#7E8D86;
  --line:#2B3833; --perf:#3A4843; --mark:#E7C735; --mark-soft:rgba(231,199,53,.32);
  --stamp:#E0694F; --focus:#8FD0B5; --shadow:0 1px 0 rgba(0,0,0,.3),0 12px 26px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;padding-inline:20px;padding-block:0 64px}
.wrap{max-width:1120px;margin:0 auto}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:4px}

/* 머리 */
.top{display:flex;align-items:center;gap:12px;padding-block:22px 10px}
.brand{font-family:var(--serif);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b{background:linear-gradient(transparent 58%,var(--mark-soft) 58%)}
.top .sp{flex:1}
.top .count{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);letter-spacing:.04em}

/* 초대장 */
.invite{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:40px;align-items:end;padding-block:40px 44px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.invite h1{font-family:var(--serif);font-weight:800;font-size:clamp(34px,6.2vw,64px);line-height:1.18;letter-spacing:-.02em;margin:14px 0 0;text-wrap:balance}
.hl{background:linear-gradient(100deg,transparent 2%,var(--mark) 3%,var(--mark) 96%,transparent 97%) no-repeat 0 78%/100% 42%;padding:0 .08em;animation:swipe .9s .25s cubic-bezier(.3,.7,.2,1) both}
@keyframes swipe{from{background-size:0% 42%}to{background-size:100% 42%}}
.invite h1{font-size:clamp(52px,11vw,104px);line-height:1.05;margin-top:10px}
.sub{font-size:17px;color:var(--ink-2);margin:14px 0 0;letter-spacing:.02em}
.chips4{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chips4 span{font-size:14px;font-weight:600;padding:6px 13px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow)}
/* 장식: 말풍선·글자 타일·이모티콘 */
.deco{position:relative;min-height:260px}
.bubble{position:absolute;font-family:var(--serif);font-weight:800;font-size:22px;background:var(--paper);color:var(--ink);padding:10px 18px;border-radius:18px;box-shadow:var(--shadow)}
.bubble::after{content:"";position:absolute;bottom:-9px;width:18px;height:18px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
.b1{left:4%;top:6%;transform:rotate(-5deg)}.b1::after{left:22px}
.b2{right:2%;top:38%;font-size:18px;background:var(--mark);color:#16241F;transform:rotate(4deg)}.b2::after{right:26px;background:var(--mark)}
.tile{position:absolute;width:54px;height:58px;border-radius:8px;background:#F4E3B5;color:#3B2A12;font-family:var(--serif);font-weight:800;font-size:30px;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),var(--shadow);animation:bob 5s ease-in-out infinite}
.tile i{position:absolute;right:6px;bottom:6px;font-style:normal;font-family:var(--mono);font-size:10px}
.t1{left:10%;bottom:10%;transform:rotate(-8deg)}.t2{left:27%;bottom:2%;transform:rotate(5deg);animation-delay:-1.2s}
.t3{left:44%;bottom:12%;transform:rotate(-3deg);animation-delay:-2.4s}.t4{right:8%;bottom:4%;transform:rotate(9deg);animation-delay:-3.1s}
.emo{position:absolute;font-size:34px;animation:bob 6s ease-in-out infinite}
.e1{left:48%;top:0}.e2{right:6%;top:2%;animation-delay:-2s}.e3{left:0;top:48%;animation-delay:-4s}.e4{left:30%;top:36%;animation-delay:-1s}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -8px}}
.steps{list-style:none;margin:0;padding:18px 0 0;display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:600;font-size:15px}
.steps li+li::before{content:"→";margin-right:22px;color:var(--ink-3)}

/* 목록 */
.shelfhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-block:34px 18px}
.shelfhead h2{font-family:var(--serif);font-weight:800;font-size:24px;margin:0}
.shelfhead span{color:var(--ink-3);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:46px 38px;padding:14px 18px 10px}

/* 티켓 */
.ticket{position:relative;display:flex;flex-direction:column;background:var(--paper);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;transition:transform .25s ease,box-shadow .25s ease}
.try,.buy{white-space:nowrap;padding:7px 11px;font-size:13px}
.stub{gap:8px;padding:12px 14px 14px}
.ticket{max-width:260px;justify-self:center;width:100%;transform:rotate(-2.2deg)}
.ticket:nth-child(even){transform:rotate(2deg) translateY(10px)}
.ticket:nth-child(3n){transform:rotate(-1deg) translateY(-4px)}
.ticket:hover{transform:rotate(0) translateY(-4px) scale(1.02);z-index:2}
.cover{position:relative;aspect-ratio:5/3;max-width:100%}
.cover canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.admit{position:absolute;left:14px;top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:rgba(255,255,255,.88)}
.kind{position:absolute;right:12px;top:10px;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.9);color:#16241F}
.body{padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.body h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.body p{margin:0;color:var(--ink-2);font-size:14px}
.feat{font-size:12.5px;font-weight:700;color:var(--ink-2);margin:6px 0 0;line-height:1.5}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.skill{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--ground);color:var(--ink-2)}
.np{display:flex;flex-direction:column;line-height:1.25}
.try{font:inherit;font-weight:700;font-size:13.5px;border:1.5px solid var(--ink);border-radius:999px;padding:7px 12px;background:transparent;color:var(--ink);cursor:pointer}
.try.on{border-color:var(--mark);background:var(--mark);color:#16241F}
.pay:enabled{cursor:pointer;opacity:1}
.stub{position:relative;display:flex;align-items:center;gap:10px;padding:14px 18px 16px;border-top:2px dashed var(--perf)}
.stub::before,.stub::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--ground)}
.stub::before{left:-10px}.stub::after{right:-10px}
.no{font-family:var(--mono);font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.price{font-family:var(--mono);font-weight:600;font-size:15px}
.stub .sp{flex:1}
.buy{font:inherit;font-weight:700;font-size:14px;border:0;border-radius:999px;padding:9px 16px;background:var(--ink);color:var(--paper);cursor:pointer;transition:background .2s}
.buy:hover{background:var(--stamp)}

.biz{margin-top:48px;padding-top:18px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:12.5px;color:var(--ink-3)}
.biz b{color:var(--ink-2)}

/* 결제 시트 */
.scrim{position:fixed;inset:0;background:rgba(10,16,14,.5);display:grid;place-items:end center;z-index:10;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%;max-width:440px;background:var(--paper);border-radius:18px;padding:22px 22px 20px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .row{display:flex;align-items:center;gap:12px}
.sheet h4{margin:0;font-size:18px}
.sheet .x{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--ink-2);cursor:pointer;padding:4px 8px}
.order{margin:16px 0;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:14px}
.order div{display:flex;justify-content:space-between;gap:12px}
.order .total{border-top:1px dashed var(--perf);padding-top:8px;font-weight:700}
.order .total span:last-child{font-family:var(--mono)}
.stampbox{display:inline-block;transform:rotate(-4deg);border:2px solid var(--stamp);color:var(--stamp);font-family:var(--mono);font-weight:600;font-size:11px;letter-spacing:.14em;padding:2px 8px;border-radius:4px}
.note{font-size:13px;color:var(--ink-2);margin:0 0 14px}
.pay{width:100%;font:inherit;font-weight:700;font-size:15.5px;border:0;border-radius:12px;padding:13px;background:var(--stamp);color:var(--stamp-ink);cursor:not-allowed;opacity:.55}

@media (max-width:760px){
  .invite{grid-template-columns:1fr;gap:8px;padding-block:22px 26px}
  .deco{min-height:190px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* 영어 교실 그림 */
.room{position:absolute;inset:0;width:100%;height:100%}
.chalk{font-family:"Comic Sans MS","Segoe Print","Nanum Pen Script",cursive;fill:#F2F0E6;font-weight:700}
.deco{min-height:300px}
.e1{left:auto;right:0;top:auto;bottom:-6px}.e2{left:-6px;right:auto;top:-10px}
/* 알파벳 깃발 줄 */
.bunting{display:flex;justify-content:center;gap:0;margin:0 -20px;padding-top:6px;overflow:hidden;height:46px}
.bunting span{position:relative;width:38px;height:40px;flex:0 0 38px;clip-path:polygon(0 0,100% 0,50% 100%);display:grid;place-items:start center;padding-top:4px;font-family:var(--serif);font-weight:800;font-size:16px;color:#fff}
.bunting::before{content:"";position:absolute}
@media (max-width:760px){.deco{min-height:240px}.bunting span{width:30px;flex-basis:30px;font-size:13px}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bunting" aria-hidden="true"><span style="background:#D8573C;">A</span><span style="background:#F2D23C;color:#16241F">B</span><span style="background:#2F6B57;">C</span><span style="background:#1F5E8C;">D</span><span style="background:#C9822B;">E</span><span style="background:#7A3E6E;">F</span><span style="background:#D8573C;">G</span><span style="background:#F2D23C;color:#16241F">H</span><span style="background:#2F6B57;">I</span><span style="background:#1F5E8C;">J</span><span style="background:#C9822B;">K</span><span style="background:#7A3E6E;">L</span><span style="background:#D8573C;">M</span><span style="background:#F2D23C;color:#16241F">N</span><span style="background:#2F6B57;">O</span><span style="background:#1F5E8C;">P</span><span style="background:#C9822B;">Q</span><span style="background:#7A3E6E;">R</span><span style="background:#D8573C;">S</span><span style="background:#F2D23C;color:#16241F">T</span><span style="background:#2F6B57;">U</span><span style="background:#1F5E8C;">V</span><span style="background:#C9822B;">W</span><span style="background:#7A3E6E;">X</span><span style="background:#D8573C;">Y</span><span style="background:#F2D23C;color:#16241F">Z</span></div>
  <header class="top">
    <div class="brand"><b>마스터</b> 영어</div>
    <div class="sp"></div>
    <div class="count" id="count"></div>
  </header>

  <section class="invite">
    <div class="hero">
      <div class="eyebrow">Invitation · 초대장</div>
      <h1><span class="hl">마스터</span><br><span class="hl">영어</span></h1>
      <p class="sub">초대장 한 장으로 영어의 방에</p>
      <div class="chips4">
        <span>🎧 듣기</span><span>🗣️ 말하기</span><span>📖 읽기</span><span>✍️ 쓰기</span>
      </div>
    </div>
    <div class="deco" aria-hidden="true">
      <svg class="room" viewBox="0 0 520 380" role="img">

        <circle cx="460" cy="40" r="26" fill="#FBFCF9" stroke="#8A5A2B" stroke-width="5"/>
        <line x1="460" y1="40" x2="460" y2="24" stroke="#16241F" stroke-width="3" stroke-linecap="round"/>
        <line x1="460" y1="40" x2="472" y2="46" stroke="#16241F" stroke-width="3" stroke-linecap="round"/>
        <!-- 칠판 -->

        <path d="M250 175 q40 -30 80 0 q40 30 70 -6" fill="none" stroke="#F2F0E6" stroke-width="3" stroke-linecap="round" opacity=".8"/>
        <text x="330" y="212" class="chalk" font-size="20" fill="#F2D23C">★ ★ ★</text>
        <rect x="32" y="232" width="382" height="10" fill="#6E4520"/>
        <rect x="120" y="226" width="34" height="8" rx="2" fill="#F2F0E6"/><rect x="170" y="226" width="22" height="8" rx="2" fill="#F2D23C"/>
        <rect x="300" y="224" width="46" height="12" rx="3" fill="#C9822B"/>
        <!-- 교탁 -->
        <rect x="150" y="300" width="330" height="18" rx="4" fill="#B5793F"/>
        <rect x="170" y="318" width="22" height="60" fill="#8A5A2B"/><rect x="438" y="318" width="22" height="60" fill="#8A5A2B"/>
        <!-- 책 더미 -->
        <rect x="178" y="282" width="96" height="18" rx="3" fill="#1F5E8C"/>
        <rect x="184" y="264" width="86" height="18" rx="3" fill="#C9822B"/>
        <rect x="174" y="246" width="92" height="18" rx="3" fill="#2F6B57"/>
        <text x="190" y="259" font-family="IBM Plex Mono,monospace" font-size="10" fill="#FBFCF9">ENGLISH</text>
        <!-- 사과 -->
        <circle cx="306" cy="284" r="16" fill="#D8573C"/><path d="M306 268 q2 -8 8 -10" stroke="#5B3A1A" stroke-width="3" fill="none"/>
        <ellipse cx="316" cy="262" rx="7" ry="4" fill="#5B6B2E" transform="rotate(-25 316 262)"/>

        <circle cx="398" cy="262" r="30" fill="#4D8FC4"/>

        <path d="M368 262 a30 30 0 0 0 60 0" fill="none" stroke="#8A5A2B" stroke-width="4"/>
        <rect x="394" y="292" width="8" height="8" fill="#8A5A2B"/>
        <!-- 연필꽂이 -->
        <rect x="438" y="270" width="26" height="30" rx="3" fill="#7A3E6E"/>
        <rect x="442" y="240" width="5" height="32" fill="#F2D23C"/><polygon points="442,240 447,240 444.5,232" fill="#16241F"/>
        <rect x="452" y="246" width="5" height="26" fill="#2F6B57"/><polygon points="452,246 457,246 454.5,238" fill="#16241F"/>
        <defs><pattern id="dust" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="8" cy="10" r="1" fill="#fff"/><circle cx="30" cy="28" r="1.2" fill="#fff"/></pattern></defs>
      </svg>
      <span class="emo e1">📚</span><span class="emo e2">🎧</span>
    </div>
  </section>
  <ol class="steps" aria-label="받는 순서">
    <li>🎟️ 고르고</li><li>🆓 하루 체험하고</li><li>💳 3,000원에 내 것</li>
  </ol>

  <div class="shelfhead">
    <h2>📚 교재</h2><span>새 교재가 나오면 끝에 한 장씩</span>
  </div>
  <div class="grid" id="grid"></div>

  <footer class="biz">
    <div><b>마스터 영어</b> · 사업자 정보와 통신판매업 신고번호는 신고를 마친 뒤 이곳에 싣습니다.</div>

</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="row"><h4 id="sheetTitle">교재 받기</h4><button class="x" id="close" aria-label="닫기">×</button></div>

      <div><span>교재</span><span id="oName"></span></div>
      <div><span>기간</span><span id="oWay"></span></div>
      <div class="total"><span>금액</span><span id="oPrice"></span></div>
    </div>

      <div style="display:flex;gap:8px"><input id="cin" placeholder="ME-XXXX-XXXX" autocomplete="off" style="flex:1;font:inherit;text-transform:uppercase;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)">

<script>
/* 새 교재는 이 목록 맨 끝에 한 줄 더하면 된다 (만든 순서)
   kind: "app"(움직이는 앱 · 1일 체험) / "file"(파일 자료 · 미리보기)   price: 올릴 때 정하는 가격 */
const APPS = [
  { title:"VOA 섀도잉", feat:["🎧 듣기","💬 자막·번역","🗣️ 따라 말하기"], desc:"미국의 소리 뉴스를 문장마다 세 번씩 따라 말하는 영상 교재.", skills:["듣기","말하기"], art:"wave", hue:"#1F5E8C", price:3000, url:"apps/voa/" },
  { title:"중급 영단어 1000", feat:["🔊 발음 듣기","🧠 외우기","✅ 문제 풀기","✍️ 써 보기"], desc:"뜻·발음·예문을 넘겨 보며 익히는 중급 핵심 단어 천 개.", skills:["읽기","듣기"], art:"cards", big:"1000", level:"INTERMEDIATE", hue:"#2F6B57", price:3000, url:"apps/words-1000-mid/" },
  { title:"초급 영단어 1000", feat:["🔊 발음 듣기","🧠 외우기","✅ 문제 풀기","✍️ 써 보기"], desc:"그림과 소리로 처음 시작하는 기초 단어 천 개.", skills:["읽기","듣기"], art:"cards", big:"1000", level:"BEGINNER", hue:"#C9822B", price:3000, url:"apps/words-1000-basic/" },
  { title:"중상급 영단어 2000", feat:["🔊 발음 듣기","🧠 외우기","✅ 문제 풀기","✍️ 써 보기"], desc:"중급을 넘어서는 단어 이천 개를 주제별 카드로.", skills:["읽기","쓰기"], art:"cards", big:"2000", level:"INTERMEDIATE+", hue:"#7A3E6E", price:3000, url:"apps/words-2000/" },
  { title:"영단어 마스터 5000", feat:["🔊 발음 듣기","🧠 외우기","✅ 문제 풀기","✍️ 써 보기"], desc:"시험과 원서 읽기에 필요한 단어 오천 개를 한 앱에.", skills:["읽기","쓰기","듣기"], art:"cards", big:"5000", level:"MASTER", hue:"#9E3B2B", price:3000, url:"apps/words-5000/" },
].map(a => ({ kind:"app", ...a }));
const ALL = ["듣기","말하기","읽기","쓰기"];
const won = n => "₩" + n.toLocaleString("ko-KR");
const grid = document.getElementById("grid");
document.getElementById("count").textContent = `교재 ${APPS.length}종 · ${won(Math.min(...APPS.map(a=>a.price)))}부터`;

/* ▼▼ 입금 계좌 — 여기 세 줄만 직접 적어 넣으세요 ▼▼ */
const OPEN = false;   /* 판매 시작 전: 체험·받기를 막고 "준비 중"으로 보여 줌. 신고·계좌 준비가 끝나면 true */
const BANK = { bank:"(은행 이름)", number:"(계좌번호)", holder:"(예금주)" };
const SELLER_EMAIL = "(입금 알림을 받을 이메일)";
/* ▲▲ ▲▲ */

/* 1일 체험: 서버가 기록하고, 이 기기에도 시작한 때를 적어 둔다 */
const DAY = 864e5, TRIAL = 1*DAY;
const appId = a => (a.url||"").split("/").filter(Boolean).pop();
let STATUS = {};   /* 서버가 알려 준 이 기기의 상태: { 교재: {kind:"p"|"t", until} } */
const tkey = i => "me.trial." + i;
function trialStart(i){ try { return +localStorage.getItem(tkey(i)) || 0; } catch(e){ return 0; } }
function trialLeft(i){ const st = STATUS[appId(APPS[i])]; if(st && st.kind==="t") return Math.max(0, st.until - Date.now());
  const s = trialStart(i); return s ? Math.max(0, s + TRIAL - Date.now()) : 0; }
function owned(i){ const st = STATUS[appId(APPS[i])]; return !!(st && st.kind==="p"); }
function daysLeft(i){ const ms = trialLeft(i), d = Math.floor(ms/DAY), h = Math.floor(ms%DAY/36e5); return d ? `${d}일 ${h}시간` : `${h}시간`; }
const EMO = {"듣기":"🎧","말하기":"🗣️","읽기":"📖","쓰기":"✍️"};

function render(){
grid.innerHTML = APPS.map((a,i)=>`
  <article class="ticket">
    <div class="cover"><canvas data-i="${i}" aria-hidden="true"></canvas><span class="admit">ADMIT ONE</span><span class="kind">${a.kind === "file" ? "📄 파일" : "📱 앱"}</span></div>
    <div class="body">
      <h3>${a.title}</h3>
      <p>${a.desc}</p>
      ${a.feat ? `<p class="feat">${a.feat.join(" → ")}</p>` : ""}
      <div class="skills">${a.skills.map(s=>`<span class="skill">${EMO[s]} ${s}</span>`).join("")}</div>
    </div>
    <div class="stub">
      <div class="np"><span class="no">No. ${String(i+1).padStart(3,"0")}</span><span class="price">${won(a.price)}</span></div>
      <span class="sp"></span>
      ${a.kind === "file"
        ? `<button class="try" data-i="${i}" data-m="peek">미리보기</button>`
        : owned(i)
        ? `<button class="try on" data-i="${i}" data-m="go">✓ 내 교재 · 열기</button>`
        : trialLeft(i) > 0
        ? `<button class="try on" data-i="${i}" data-m="open">체험 중 · ${daysLeft(i)}</button>`
        : `<button class="try" data-i="${i}" data-m="try">1일 체험</button>`}
      <button class="buy" data-i="${i}" data-m="buy">받기</button>
    </div>
  </article>`).join("");
  document.querySelectorAll(".cover canvas").forEach(draw);
}

/* 표지 그림 */
function shade(hex, f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=n>>8&255,b=n&255;
  const t=f<0?0:255, p=Math.abs(f); r=Math.round((t-r)*p+r); g=Math.round((t-g)*p+g); b=Math.round((t-b)*p+b); return `rgb(${r},${g},${b})`; }
function draw(cv){
  const a = APPS[+cv.dataset.i], dpr = Math.min(2, window.devicePixelRatio||1);
  const w = cv.clientWidth, h = cv.clientHeight; if(!w) return;
  cv.width = w*dpr; cv.height = h*dpr; const c = cv.getContext("2d"); c.scale(dpr,dpr);
  const g = c.createLinearGradient(0,0,w,h); g.addColorStop(0,shade(a.hue,.08)); g.addColorStop(1,shade(a.hue,-.28));
  c.fillStyle = g; c.fillRect(0,0,w,h);
  if(a.art==="wave"){
    const mid=h*.56, n=Math.floor(w/7);
    for(let k=0;k<n;k++){ const x=10+k*7, t=k/n;
      const amp=(Math.sin(t*19)*.5+.5)*(Math.sin(t*5.3+1)*.5+.6)*h*.3+3;
      c.fillStyle = k/n<.42 ? "rgba(255,255,255,.95)" : "rgba(255,255,255,.35)";
      c.fillRect(x,mid-amp/2,3.2,amp); }
    c.fillStyle="rgba(255,255,255,.92)"; c.font="600 12px 'IBM Plex Mono',monospace";
    c.fillText("● LISTEN  ×3  REPEAT", 14, h-16);
  } else if(a.art==="doc"){
    c.save(); c.translate(w*.5,h*.54); c.rotate(-.05);
    const pw=w*.36, ph=h*.66, x=-pw/2, y=-ph/2, f=16;
    c.fillStyle="rgba(0,0,0,.18)"; c.fillRect(x+6,y+6,pw,ph);
    c.fillStyle="#FBFCF9"; c.beginPath(); c.moveTo(x,y); c.lineTo(x+pw-f,y); c.lineTo(x+pw,y+f); c.lineTo(x+pw,y+ph); c.lineTo(x,y+ph); c.closePath(); c.fill();
    c.fillStyle="#D9DED9"; c.beginPath(); c.moveTo(x+pw-f,y); c.lineTo(x+pw-f,y+f); c.lineTo(x+pw,y+f); c.closePath(); c.fill();
    c.fillStyle=shade(a.hue,-.15); c.font="700 "+Math.round(h*(a.big.length>4?.09:.16))+"px 'Nanum Myeongjo',serif"; c.textAlign="center";
    c.fillText(a.big,0,y+ph*.36);
    c.fillStyle="#CBD4CE"; for(let k=0;k<5;k++) c.fillRect(x+12,y+ph*.5+k*9,pw-24-(k%2)*18,3);
    c.restore();
    c.fillStyle="rgba(255,255,255,.9)"; c.font="600 11px 'IBM Plex Mono',monospace"; c.textAlign="left";
    c.fillText("FILE · READ ANYWHERE", 14, h-16);
  } else {
    for(let k=2;k>=0;k--){ c.save(); c.translate(w*.62+k*9,h*.53-k*7); c.rotate((k-1)*.07);
      const cw=w*.44,ch=h*.56; c.fillStyle=k? "rgba(255,255,255,"+(.18+.14*(2-k))+")" : "#FBFCF9";
      c.beginPath(); c.roundRect(-cw/2,-ch/2,cw,ch,10); c.fill();
      if(!k){ c.fillStyle=shade(a.hue,-.2); c.font="700 "+Math.round(h*.2)+"px 'IBM Plex Mono',monospace"; c.textAlign="center";
        c.fillText(a.big,0,h*.05); c.font="600 10px 'IBM Plex Mono',monospace"; c.fillStyle="#7F8C86"; c.fillText("WORDS",0,h*.16); }
      c.restore(); }
    c.fillStyle="rgba(255,255,255,.9)"; c.font="600 11px 'IBM Plex Mono',monospace"; c.textAlign="left";
    c.fillText(a.level, 14, h-16);
  }
}
const all = () => document.querySelectorAll(".cover canvas").forEach(draw);
render();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(all);
addEventListener("resize", all);

/* 체험·받기 시트 */
const scrim = document.getElementById("scrim"), $ = id => document.getElementById(id);
let cur = 0;
grid.addEventListener("click", e=>{
  const b = e.target.closest("button[data-m]"); if(!b) return;
  cur = +b.dataset.i; const a = APPS[cur], m = b.dataset.m;
  $("codebox").hidden = true; $("cmsg").textContent = "";
  if(m === "go" && owned(cur)){ location.href = a.url; return; }
  $("oName").textContent = a.title;
  if(!OPEN && (m === "buy" || m === "try")){
    $("sheetTitle").textContent = "🛠️ 판매 준비 중";
    $("oWay").textContent = "곧 열립니다";
    $("oPrice").textContent = won(a.price);
    $("note").innerHTML = "통신판매업 신고를 마치는 대로 <b>1일 무료 체험</b>과 <b>교재 받기</b>를 엽니다. 조금만 기다려 주세요.";
    $("pay").textContent = "준비 중"; $("pay").disabled = true; $("pay").dataset.m = "";
    scrim.hidden = false; $("close").focus(); return;
  }
  if(m === "buy"){
    $("sheetTitle").textContent = "💳 교재 받기 · 계좌이체";
    $("oWay").textContent = "입금 확인 후 접속 코드 보내 드림";
    $("oPrice").textContent = won(a.price);
    $("note").innerHTML = `<b>${BANK.bank} ${BANK.number}</b> (예금주 ${BANK.holder})<br>
      ① 위 계좌로 ${won(a.price)}을 입금하고 ② 아래 <b>입금 알리기</b>를 눌러 이메일을 보내 주세요.<br>
      확인하는 대로 <b>접속 코드</b>를 이메일로 보내 드립니다.`;
    $("pay").textContent = "✉️ 입금 알리기"; $("pay").disabled = false; $("pay").dataset.m = "mail";
    $("codebox").hidden = false;
  } else if(m === "try"){
    $("sheetTitle").textContent = "🆓 1일 무료 체험";
    $("oWay").textContent = "지금부터 24시간";
    $("oPrice").textContent = won(0);
    $("note").textContent = `체험이 끝나면 ${won(a.price)}으로 계속 쓸 수 있습니다.`;
    $("pay").textContent = "체험 시작"; $("pay").disabled = false; $("pay").dataset.m = "start";
  } else if(m === "peek"){
    $("sheetTitle").textContent = "👀 미리보기";
    $("oWay").textContent = "앞부분 몇 쪽";
    $("oPrice").textContent = won(0);
    $("note").innerHTML = '<span class="stampbox">파일 주소 연결 전</span>&nbsp; 파일을 올리면 앞부분을 여기서 볼 수 있습니다.';
    $("pay").textContent = "미리보기 열기"; $("pay").disabled = true; $("pay").dataset.m = "";
  } else {
    $("sheetTitle").textContent = "🆓 체험 중";
    $("oWay").textContent = `${daysLeft(cur)} 남음`;
    $("oPrice").textContent = won(0);
    if(a.url){
      $("note").textContent = `체험이 끝나면 ${won(a.price)}으로 계속 쓸 수 있습니다.`;
      $("pay").textContent = "교재 열기"; $("pay").disabled = false; $("pay").dataset.m = "go";
    } else {
      $("note").innerHTML = '<span class="stampbox">앱 주소 연결 전</span>&nbsp; 교재 주소를 넣으면 이 단추로 바로 열립니다.';
      $("pay").textContent = "교재 열기"; $("pay").disabled = true; $("pay").dataset.m = "";
    }
  }
  scrim.hidden = false; $("close").focus();
});
$("pay").addEventListener("click", ()=>{
  const m = $("pay").dataset.m, a = APPS[cur];
  if(m === "start"){
    fetch("/api/trial", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ app: appId(a) }) })
      .then(r => r.json().then(d => [r.ok, d])).then(([ok, d]) => {
        if(!ok){ $("note").textContent = d.error || "체험을 시작할 수 없습니다."; return; }
        try { localStorage.setItem(tkey(cur), String(Date.now())); } catch(e){}
        STATUS[appId(a)] = { kind:"t", until:d.until }; scrim.hidden = true; render();
        if(a.url) location.href = a.url;      /* 체험을 시작하면 바로 교재가 열린다 */
      }).catch(() => { $("note").textContent = "연결이 원활하지 않습니다. 잠시 뒤 다시 눌러 주세요."; });
  } else if(m === "mail"){
    const sub = `[마스터 영어] 입금 알림 · ${a.title}`;
    const body = `교재: ${a.title}
금액: ${won(a.price)}
입금자명: 
코드를 받을 이메일: 
`;
    location.href = `mailto:${SELLER_EMAIL}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`;
  } else if(m === "go" && a.url){
    location.href = a.url;
  }
});
$("cgo").addEventListener("click", ()=>{
  fetch("/api/unlock", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({ code: $("cin").value }) })
    .then(r => r.json().then(d => [r.ok, d])).then(([ok, d]) => {
      if(!ok){ $("cmsg").textContent = d.error || "코드를 확인해 주세요."; return; }
      location.href = "apps/" + d.app + "/";
    }).catch(() => { $("cmsg").textContent = "연결이 원활하지 않습니다."; });
});
/* 이 기기에서 산 교재·체험 상태를 서버에서 받아 카드에 반영 */
fetch("/api/status").then(r => r.ok ? r.json() : {}).then(d => { STATUS = d || {}; render(); }).catch(()=>{});
const shut = () => { scrim.hidden = true; };
document.getElementById("close").onclick = shut;
scrim.addEventListener("click", e=>{ if(e.target===scrim) shut(); });
addEventListener("keydown", e=>{ if(e.key==="Escape") shut(); });
</script>
</body>
</html>
