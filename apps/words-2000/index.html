<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>단어 마스터 2000</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);color:#f8fafc;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:16px 14px 60px}
.app{max-width:660px;margin:0 auto}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px}
.tl{font-size:20px;font-weight:800;color:#38bdf8}
.hr{display:flex;gap:6px;flex-wrap:wrap}
.bg{background:#1e3a5f;color:#93c5fd;border-radius:16px;padding:3px 9px;font-size:12px;font-weight:700}
.bg.g{background:#14532d;color:#4ade80}
.nv{display:flex;border-radius:10px;overflow:hidden;border:1px solid #334155;margin-bottom:16px}
.nb{flex:1;padding:9px 4px;background:#1e293b;color:#64748b;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-align:center}
.nb:not(:last-child){border-right:1px solid #334155}
.nb.on{background:#0284c7;color:#fff}
.list{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.wr{display:grid;grid-template-columns:1fr 1fr auto auto;gap:7px;align-items:center;background:#1e293b;border-radius:10px;padding:9px 12px;border:1px solid #334155}
.wr.dn{background:#0d2018;border-color:#22c55e;opacity:.85}
.we{font-size:16px;font-weight:800;color:#38bdf8}
.wk{font-size:13px;color:#94a3b8;word-break:keep-all;line-height:1.3}
.wr.dn .we,.wr.dn .wk{color:#4ade80}
.spk{background:#0284c7;color:#fff;border:none;border-radius:5px;padding:5px 9px;cursor:pointer;font-size:13px}
.mc{background:#334155;color:#94a3b8;border:none;border-radius:5px;padding:5px 8px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit;white-space:nowrap}
.mc:hover{background:#22c55e;color:#fff}
.wr.dn .mc{background:#14532d;color:#4ade80}
.sbw{display:flex;justify-content:center;margin-top:10px}
.pw{height:5px;background:#334155;border-radius:4px;overflow:hidden;margin-bottom:3px}
.pb{height:100%;background:linear-gradient(90deg,#0284c7,#38bdf8);border-radius:4px;transition:width .3s}
.pi{font-size:11px;color:#64748b;margin-bottom:11px;display:flex;justify-content:space-between}
.sts{display:flex;gap:3px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.st{padding:4px 8px;border-radius:6px;background:#1e293b;color:#64748b;font-size:11px;font-weight:600;border:1px solid #334155}
.st.on{background:#0284c7;color:#fff;border-color:#0284c7}
.st.d2{background:#14532d;color:#4ade80;border-color:#22c55e}
.sk{margin-left:auto;background:#334155;color:#94a3b8;border:none;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit}
.sk:hover{background:#475569;color:#fff}
.cw{display:flex;flex-direction:column;align-items:center;gap:10px}
.card{width:100%;max-width:480px;min-height:175px;background:linear-gradient(135deg,#1e3a5f,#0f2644);border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid #0284c7;box-shadow:0 4px 24px rgba(2,132,199,.2);padding:24px}
.card.fl{background:linear-gradient(135deg,#14532d,#052e16)}
.ci{text-align:center;width:100%}
.ce{font-size:36px;font-weight:800;color:#38bdf8;letter-spacing:-1px;margin-bottom:8px;word-break:break-all}
.ck{font-size:21px;font-weight:700;color:#4ade80;margin-bottom:8px;word-break:keep-all;line-height:1.4}
.hn{color:#64748b;font-size:12px;margin-top:4px}
.btn{background:#0284c7;color:#fff;border:none;border-radius:9px;padding:9px 20px;cursor:pointer;font-weight:700;font-size:14px;font-family:inherit}
.btn.g{background:#22c55e}.btn.gy{background:#475569}.btn.sm{font-size:12px;padding:6px 12px}.btn.r{background:#dc2626}
.btn:hover{opacity:.88}
.br{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sb{display:inline-flex;align-items:center;gap:5px;background:#0284c7;color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;font-weight:700;font-size:13px;margin-top:10px;font-family:inherit}
.ss{display:inline-flex;align-items:center;gap:4px;background:#0284c7;color:#fff;border:none;border-radius:5px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:12px;margin-top:7px;font-family:inherit}
.qc{width:100%;max-width:480px;background:#1e293b;border-radius:18px;padding:20px;border:1px solid #334155;display:flex;flex-direction:column;align-items:center;gap:10px}
.qq{color:#94a3b8;font-size:13px;margin-bottom:3px}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.cb{background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:9px;padding:11px 7px;cursor:pointer;font-weight:600;font-size:13px;min-height:52px;word-break:keep-all;font-family:inherit;line-height:1.3}
.cb:hover:not([disabled]){background:#1e3a5f}
.cb.ok{background:#14532d;border-color:#22c55e;color:#4ade80}
.cb.ng{background:#450a0a;border-color:#ef4444;color:#f87171}
.ti{width:100%;background:#0f172a;border:2px solid #334155;border-radius:9px;color:#f8fafc;font-size:17px;padding:11px 14px;outline:none;font-family:inherit}
.ti:focus{border-color:#0284c7}
.rok{color:#4ade80;font-weight:700;font-size:15px;text-align:center;margin:6px 0}
.rng{color:#f87171;font-weight:700;font-size:15px;text-align:center;margin:6px 0}
.eb{background:#0f172a;border:1px solid #334155;border-radius:10px;padding:14px;width:100%;text-align:center}
.es{color:#fde68a;font-style:italic;font-size:14px;line-height:1.6;margin-bottom:7px}
.mr{width:100%;max-width:480px;display:flex;justify-content:flex-end;margin-top:7px}
.cel{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;gap:14px;text-align:center}
.ct{font-size:22px;font-weight:800;color:#38bdf8}
.cs{color:#94a3b8;font-size:14px;line-height:1.6}
.exb{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:18px;margin-top:6px}
.ex-title{font-size:14px;font-weight:700;color:#38bdf8;margin-bottom:11px}
.exbt{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.ml-item{display:inline-flex;align-items:center;gap:3px;background:#0f172a;border-radius:5px;padding:2px 7px;font-size:12px;margin:2px}
.ml-en{color:#38bdf8;font-weight:700}
.ml-ko{color:#64748b;font-size:11px}
.dt-head{font-size:12px;color:#4ade80;font-weight:700;margin-bottom:5px}
@media(max-width:400px){.ce{font-size:28px}.cg{grid-template-columns:1fr}.wr{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app" id="app">
  <div style="text-align:center;padding:80px 20px;color:#64748b;font-size:18px">⏳</div>
</div>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
