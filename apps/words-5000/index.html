<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Vocabulary Master</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap');
:root{--bg:#0A0E1A;--bg2:#111827;--bg3:#1C2538;--gold:#D4A843;--gold2:#F0C96A;--blue:#4F8EF7;--green:#3EC97A;--red:#F05454;--purple:#8B5CF6;--text:#E8E4DC;--muted:#8892A4;--hint:#4A5568;--r:14px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem;}
.header{background:linear-gradient(135deg,#0D1525,#162040);border-bottom:1px solid rgba(212,168,67,.3);padding:1rem 1.25rem .875rem;text-align:center;}
.header h1{font-family:Georgia,serif;font-size:22px;color:var(--gold2);margin-bottom:3px;}
.header p{font-size:12px;color:var(--muted);}
.tabs{display:flex;background:var(--bg2);border-bottom:1px solid rgba(255,255,255,.06);}
.tab{flex:1;padding:10px 4px;border:none;background:none;color:var(--hint);font-size:11px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .2s;}
.tab.active{color:var(--gold2);border-bottom-color:var(--gold);}
.tab.done{color:var(--green);}
.prog-wrap{padding:.75rem 1rem .5rem;background:var(--bg2);}
.prog-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px;}
.prog-bar{height:4px;background:rgba(255,255,255,.08);border-radius:99px;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--gold));transition:width .4s;}
.content{padding:.875rem 1rem;max-width:540px;margin:0 auto;}
.card{background:var(--bg3);border:1px solid rgba(255,255,255,.07);border-radius:var(--r);padding:1.5rem 1.25rem;margin-bottom:.875rem;box-shadow:0 4px 24px rgba(0,0,0,.4);}
.slabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.75rem;}
.word-disp{font-family:Georgia,serif;font-size:36px;font-weight:900;color:var(--gold2);margin-bottom:4px;line-height:1.15;}
.pos-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(212,168,67,.15);color:var(--gold);margin-bottom:.875rem;}
.def-disp{font-size:17px;line-height:1.65;color:var(--text);font-style:italic;}
.def-disp.big{font-size:18px;font-style:normal;font-weight:600;}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:1rem;}
.cbtn{width:100%;padding:13px 16px;background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.1);border-radius:10px;color:var(--text);font-size:14px;font-weight:500;text-align:left;cursor:pointer;line-height:1.5;display:flex;align-items:flex-start;gap:10px;transition:all .15s;}
.cnum{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px;}
.cbtn:hover:not(:disabled){background:rgba(79,142,247,.12);border-color:var(--blue);}
.cbtn.correct{background:rgba(62,201,122,.15);border-color:var(--green);color:var(--green);}
.cbtn.correct .cnum{background:var(--green);color:#fff;}
.cbtn.wrong{background:rgba(240,84,84,.15);border-color:var(--red);color:var(--red);}
.cbtn.wrong .cnum{background:var(--red);color:#fff;}
.cbtn:disabled{cursor:default;}
.tinp{width:100%;padding:14px 16px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.12);border-radius:10px;color:var(--text);font-size:18px;font-weight:600;font-family:Georgia,serif;outline:none;transition:border-color .2s;margin-bottom:8px;}
.tinp:focus{border-color:var(--blue);}
.tinp.correct{border-color:var(--green);background:rgba(62,201,122,.1);}
.tinp.wrong{border-color:var(--red);background:rgba(240,84,84,.1);}
.brow{display:flex;gap:8px;margin-top:.5rem;}
.btn{padding:11px 20px;border-radius:10px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;}
.bp{background:linear-gradient(135deg,var(--blue),#3A6FD4);color:#fff;flex:1;}
.bs{background:rgba(255,255,255,.08);color:var(--muted);border:1px solid rgba(255,255,255,.1);}
.bg{background:linear-gradient(135deg,var(--gold),#B8902A);color:#0A0E1A;flex:1;}
.bv{background:rgba(139,92,246,.15);color:var(--purple);border:1px solid rgba(139,92,246,.3);}
.btn:active{transform:scale(.97);}
.fb{text-align:center;padding:.875rem;border-radius:10px;font-size:15px;font-weight:700;margin-top:.75rem;animation:pop .2s ease;}
.fb.ok{background:rgba(62,201,122,.15);color:var(--green);}
.fb.err{background:rgba(240,84,84,.15);color:var(--red);}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.srow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:.875rem;}
.sbadge{padding:5px 14px;border-radius:99px;font-size:12px;font-weight:700;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:var(--muted);}
.sbadge.hi{background:rgba(62,201,122,.15);border-color:rgba(62,201,122,.3);color:var(--green);}
.sbadge.lo{background:rgba(240,84,84,.15);border-color:rgba(240,84,84,.3);color:var(--red);}
.twords{background:rgba(255,255,255,.04);border-radius:10px;padding:.875rem;margin-bottom:1.25rem;max-height:440px;overflow-y:auto;}
.twords h4{font-size:12px;color:var(--gold);margin-bottom:.5rem;letter-spacing:.05em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;}
.twi{display:flex;align-items:flex-start;gap:6px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.04);}
.twi:last-child{border-bottom:none;}
.twiw{color:var(--gold2);font-weight:700;font-family:Georgia,serif;font-size:15px;min-width:110px;flex-shrink:0;}
.twid{color:var(--muted);font-size:12px;flex:1;line-height:1.5;}
.tbtn{background:none;border:none;cursor:pointer;font-size:14px;padding:2px 4px;opacity:.7;flex-shrink:0;}
.tbtn:hover{opacity:1;}

.mem-btn{background:rgba(62,201,122,.1);border:1px solid rgba(62,201,122,.2);border-radius:6px;font-size:10px;font-weight:700;color:var(--green);cursor:pointer;padding:2px 7px;white-space:nowrap;flex-shrink:0;}
.mem-btn.done-mem{background:rgba(212,168,67,.15);border-color:rgba(212,168,67,.3);color:var(--gold);}
.stat-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;}
.stat{background:var(--bg3);border-radius:10px;padding:.625rem 1rem;flex:1;min-width:80px;text-align:center;}
.stat-n{font-size:22px;font-weight:700;color:var(--gold2);}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px;}
.sc{background:rgba(79,142,247,.08);border:1px solid rgba(79,142,247,.2);border-radius:10px;padding:1rem 1.1rem;margin-bottom:.75rem;line-height:1.7;}
.se{font-size:15px;color:var(--text);margin-bottom:6px;}
.sw{color:var(--gold2);font-weight:700;}
.sk{font-size:13px;color:var(--muted);border-top:1px solid rgba(255,255,255,.06);padding-top:6px;margin-top:4px;}
.mem-list{max-height:420px;overflow-y:auto;}
.mem-item{display:flex;align-items:baseline;gap:10px;padding:8px 4px;border-bottom:1px solid rgba(255,255,255,.05);}
.mem-item:last-child{border-bottom:none;}
.miw{color:var(--gold2);font-weight:700;font-family:Georgia,serif;font-size:16px;min-width:120px;}
.mip{color:var(--gold);font-size:11px;}
.mid{color:var(--muted);font-size:13px;flex:1;}
.mi-del{background:none;border:none;color:var(--hint);cursor:pointer;font-size:14px;}
.ml{background:rgba(240,84,84,.06);border-radius:10px;padding:.875rem;margin-bottom:.875rem;}
.ml h4{font-size:12px;color:var(--red);margin-bottom:.5rem;text-transform:uppercase;}
.mli{font-size:13px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.04);display:flex;gap:8px;}
.mliw{color:var(--gold2);font-weight:700;font-family:Georgia,serif;min-width:110px;}
.mlid{color:var(--muted);font-size:12px;}
.cbadge{position:fixed;top:80px;right:16px;background:var(--gold);color:#0A0E1A;padding:6px 14px;border-radius:99px;font-size:13px;font-weight:900;animation:si .3s ease;z-index:100;}
@keyframes si{from{transform:translateX(60px);opacity:0}to{transform:translateX(0);opacity:1}}







::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--hint);border-radius:99px;}
</style>
</head>

let TW=[],stage=-1,qIdx=0,score={c:0,w:0},missed=[],combo=0,stageDone=[false,false,false,false],answered=false,curView='home';
let MEMORIZED=JSON.parse(localStorage.getItem('vm_mem')||'[]');
let SEEN=JSON.parse(localStorage.getItem('vm_seen')||'[]');
function saveMem(){localStorage.setItem('vm_mem',JSON.stringify(MEMORIZED));}
function saveSeen(){localStorage.setItem('vm_seen',JSON.stringify(SEEN));}
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function set$(h){document.getElementById('mc').innerHTML=h;}

function speak(idx){
  const w=TW[idx]||AW[idx];if(!w)return;
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w.w);
  u.lang='en-US';u.rate=0.85;
  const vs=speechSynthesis.getVoices();
  const eng=vs.find(v=>v.lang.startsWith('en'));
  if(eng)u.voice=eng;
  speechSynthesis.speak(u);
}
window.speechSynthesis&&speechSynthesis.getVoices();

function toggleMem(idx){
  const w=TW[idx];if(!w)return;
  const btn=document.getElementById('mb-'+idx);
  const has=MEMORIZED.find(m=>m.w===w.w);
  if(has){
    MEMORIZED=MEMORIZED.filter(m=>m.w!==w.w);
    if(btn){btn.textContent='암기완료';btn.classList.remove('done-mem');}
  } else {
    MEMORIZED.push({w:w.w,p:w.p,d:w.d,k:w.k,date:new Date().toLocaleDateString('ko-KR')});
    if(btn){btn.textContent='&#9989;암기됨';btn.classList.add('done-mem');}
  }
  saveMem();updateHStat();
}

function pickToday(){
  const memW=MEMORIZED.map(m=>m.w);
  let pool=AW.filter(w=>!memW.includes(w.w)&&!SEEN.includes(w.w));
  if(pool.length<20){SEEN=[];saveSeen();pool=AW.filter(w=>!memW.includes(w.w));}
  const mv=missed.filter(w=>pool.some(p=>p.w===w.w)).slice(0,5);
  const mwl=mv.map(w=>w.w);
  const extra=shuffle(pool.filter(w=>!mwl.includes(w.w))).slice(0,20-mv.length);
  TW=shuffle([...mv,...extra]).slice(0,20);
  TW.forEach(w=>{if(!SEEN.includes(w.w))SEEN.push(w.w);});
  saveSeen();missed=[];
}

document.addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.nv&&t.textContent){
    window.open('https://dict.naver.com/search.nhn?query='+encodeURIComponent(t.textContent.trim()),'_blank');
  }
});

function updateHStat(){
  const pct=Math.round(SEEN.length/AW.length*100);
  document.getElementById('hstat').textContent='5,014단어 | 암기완료 '+MEMORIZED.length+'개 | 진도 '+pct+'%';
}

function openNaverMain(){
  window.open('https://dict.naver.com/','_blank');
}

function speakAll(){
  let i=0;
  function next(){
    if(i>=TW.length)return;
    const w=TW[i];i++;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(w.w+'. '+w.d);
    u.lang='en-US';u.rate=0.8;
    const vs=speechSynthesis.getVoices();
    const eng=vs.find(v=>v.lang.startsWith('en'));
    if(eng)u.voice=eng;
    const delay=(w.w.length+w.d.length)*55+900;
    u.onend=()=>setTimeout(next,400);
    speechSynthesis.speak(u);
  }
  next();
}

function switchView(v){
  curView=v;
  ['home','study','memo'].forEach((t,i)=>{
    document.getElementById('nb'+i).classList.toggle('active',t===v);
  });
  document.getElementById('stage-bar').style.display=v==='study'?'flex':'none';
  document.getElementById('prog-wrap').style.display=(v==='study'&&stage>=0&&stage<3)?'block':'none';
  if(v==='home')showHome();
  else if(v==='study'){if(stage===-1)showHome();else renderQ();}
  else showMemo();
}

function showHome(){
  stage=-1;
  document.getElementById('stage-bar').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
  score={c:0,w:0};combo=0;qIdx=0;answered=false;stageDone=[false,false,false,false];
  pickToday();
  const list=TW.map((w,i)=>{
    const hasMem=!!MEMORIZED.find(m=>m.w===w.w);
    return '<div class="twi">'
      +'<span class="twiw" data-nv="1" style="cursor:pointer;text-decoration:underline dotted" title="네이버사전">'+w.w+'</span>'

      +'<button class="kor-btn" onclick="showKorPop('+i+')">KOR</button>'
      +'<button class="tbtn" onclick="speak('+i+')" title="발음듣기">&#128266;</button>'

  }).join('');
  const pct=Math.round(SEEN.length/AW.length*100);
  set$('<div class="stat-bar">'

    +'<div style="text-align:center;margin-bottom:1rem">'
    +'<div style="font-family:Georgia,serif;font-size:22px;color:var(--gold2);margin-bottom:4px">오늘의 단어 20개</div>'
    +'<p style="font-size:13px;color:var(--muted)">KOR=한글뜻 | &#128266;=발음 | 암기완료=저장</p>'
    +'</div>'
    +'<div class="twords">'
    +'<h4 style="display:flex;align-items:center;justify-content:space-between">&#128203; 단어 목록<span style="display:flex;gap:6px"><button style="background:none;border:none;color:var(--blue);font-size:11px;cursor:pointer;font-weight:700" onclick="speakAll()">&#9654; 전체읽기</button><button style="background:rgba(62,201,122,.12);border:1px solid rgba(62,201,122,.3);border-radius:6px;font-size:11px;font-weight:700;color:var(--green);cursor:pointer;padding:2px 9px" onclick="openNaverMain()">&#128214; 네이버사전</button></span></h4>'

    +'<button class="btn bg" style="width:100%;padding:15px;font-size:16px" onclick="startStudy()">&#128640; 4단계 학습 시작!</button>'

  updateHStat();
}

function startStudy(){switchView('study');startStage(0);}

function startStage(s){
  stage=s;qIdx=0;answered=false;score={c:0,w:0};
  document.getElementById('stage-bar').style.display='flex';
  for(let i=0;i<4;i++)document.getElementById('sb'+i).classList.toggle('active',i===s);
  renderQ();
}
function goStage(s){if(s>0&&!stageDone[s-1])return;startStage(s);}

function upProg(){
  const p=Math.round(qIdx/TW.length*100);
  document.getElementById('prog-wrap').style.display='block';
  document.getElementById('ptxt').textContent=(qIdx+1)+' / '+TW.length;
  document.getElementById('ppct').textContent=p+'%';
  document.getElementById('pfill').style.width=p+'%';
}

function renderQ(){upProg();[rS0,rS1,rS2,rS3][stage]&&[rS0,rS1,rS2,rS3][stage]();}

function srow(){return '<div class="srow"><div class="sbadge hi">&#9989; '+score.c+'</div><div class="sbadge lo">&#10060; '+score.w+'</div><div class="sbadge">&#128293; '+combo+'연속</div></div>';}

function rS0(){
  const cur=TW[qIdx];
  const wr=shuffle(AW.filter(w=>w.w!==cur.w)).slice(0,3);
  const ch=shuffle([cur,...wr]);
  let btns=ch.map((c,i)=>'<button class="cbtn" data-w="'+c.w+'" data-correct="'+cur.w+'" onclick="chkS0(this)">'
    +'<span class="cnum">'+['A','B','C','D'][i]+'</span><span>'+c.d+'</span></button>').join('');
  set$('<div class="card"><div class="slabel" style="color:var(--blue)">&#127919; 1단계 — 단어를 보고 정의를 고르세요</div>'
    +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">'
    +'<div class="word-disp">'+cur.w+'</div>'
    +'<button class="tbtn" style="font-size:22px" onclick="speakW()">&#128266;</button></div>'
    +(cur.p?'<span class="pos-badge">'+cur.p+'.</span>':'')
    +'<div class="choices">'+btns+'</div><div id="fb"></div></div>'+srow());
}
function speakW(){
  if(!window.speechSynthesis)return;
  const cur=TW[qIdx];if(!cur)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(cur.w);
  u.lang='en-US';u.rate=0.85;
  const vs=speechSynthesis.getVoices();
  const eng=vs.find(v=>v.lang.startsWith('en'));
  if(eng)u.voice=eng;
  speechSynthesis.speak(u);
}
function chkS0(btn){
  if(answered)return;answered=true;
  const chosen=btn.dataset.w,correct=btn.dataset.correct;
  document.querySelectorAll('.cbtn').forEach(b=>b.disabled=true);
  if(chosen===correct){
    btn.classList.add('correct');score.c++;combo++;
    setFB(true);if(combo>=3)showCombo();setTimeout(nextQ,900);
  } else {
    btn.classList.add('wrong');score.w++;combo=0;
    document.querySelectorAll('.cbtn').forEach(b=>{if(b.dataset.w===correct)b.classList.add('correct');});
    addMissed(TW[qIdx]);setFB(false,correct);setTimeout(nextQ,1600);
  }
}

function rS1(){
  const cur=TW[qIdx];
  const wr=shuffle(AW.filter(w=>w.w!==cur.w)).slice(0,3);
  const ch=shuffle([cur,...wr]);
  let btns=ch.map((c,i)=>'<button class="cbtn" data-w="'+c.w+'" data-correct="'+cur.w+'" onclick="chkS1(this)">'
    +'<span class="cnum">'+['A','B','C','D'][i]+'</span>'
    +'<span style="font-family:Georgia,serif;font-size:17px;font-weight:700">'+c.w+'</span></button>').join('');
  set$('<div class="card"><div class="slabel" style="color:var(--purple)">&#128269; 2단계 — 정의를 보고 단어를 고르세요</div>'
    +'<div class="def-disp big">'+cur.d+'</div>'
    +(cur.p?'<span class="pos-badge" style="margin-top:.75rem">'+cur.p+'.</span>':'')
    +'<div class="choices" style="margin-top:1rem">'+btns+'</div><div id="fb"></div></div>'+srow());
}
function chkS1(btn){
  if(answered)return;answered=true;
  const chosen=btn.dataset.w,correct=btn.dataset.correct;
  document.querySelectorAll('.cbtn').forEach(b=>b.disabled=true);
  if(chosen===correct){
    btn.classList.add('correct');score.c++;combo++;
    setFB(true);if(combo>=3)showCombo();setTimeout(nextQ,900);
  } else {
    btn.classList.add('wrong');score.w++;combo=0;
    document.querySelectorAll('.cbtn').forEach(b=>{if(b.dataset.w===correct)b.classList.add('correct');});
    addMissed(TW[qIdx]);setFB(false,correct);setTimeout(nextQ,1600);
  }
}

function rS2(){
  const cur=TW[qIdx];
  set$('<div class="card"><div class="slabel" style="color:var(--green)">&#9999; 3단계 — 정의를 보고 단어를 입력하세요</div>'
    +'<div class="def-disp big">'+cur.d+'</div>'
    +(cur.p?'<span class="pos-badge" style="margin-top:.75rem">'+cur.p+'.</span>':'')
    +'<div style="margin-top:1rem">'
    +'<input class="tinp" id="ti" placeholder="단어를 입력하세요..." onkeydown="if(event.key==String.fromCharCode(13))chkS2()">'
    +'<div style="font-size:12px;color:var(--hint);margin-bottom:8px">&#128161; 글자 수: '+cur.w.length+'자 &nbsp;&#183;&nbsp; 첫 글자: <strong style="color:var(--gold)">'+cur.w[0].toUpperCase()+'</strong></div>'
    +'<div class="brow">'
    +'<button class="btn bp" onclick="chkS2()">&#10003; 확인</button>'
    +'<button class="btn bv" onclick="showAns2()">&#128065; 정답보기</button>'
    +'</div></div><div id="fb"></div></div>'+srow());
  setTimeout(()=>document.getElementById('ti')&&document.getElementById('ti').focus(),100);
}
function chkS2(){
  const ti=document.getElementById('ti');
  if(!ti||answered)return;
  const typed=ti.value.trim().toLowerCase(),correct=TW[qIdx].w.toLowerCase();
  answered=true;
  if(typed===correct){
    ti.classList.add('correct');score.c++;combo++;
    setFB(true);if(combo>=3)showCombo();setTimeout(nextQ,900);
  } else {
    ti.classList.add('wrong');score.w++;combo=0;
    addMissed(TW[qIdx]);setFB(false,TW[qIdx].w);setTimeout(nextQ,1800);
  }
}
function showAns2(){
  const cur=TW[qIdx],ti=document.getElementById('ti');
  if(ti){ti.value=cur.w;ti.classList.add('wrong');ti.disabled=true;}
  answered=true;score.w++;combo=0;addMissed(cur);
  setFB(false,cur.w,'정답 확인! 다시 연습 목록에 추가됩니다.');setTimeout(nextQ,2000);
}

function rS3(){
  const T=[
    (w,d)=>'The word <b class="sw">'+w+'</b> means: '+d+'.',
    (w,d)=>'<b class="sw">'+w[0].toUpperCase()+w.slice(1)+'</b> is defined as '+d.toLowerCase()+'.',
    (w,d)=>'We use <b class="sw">'+w+'</b> to express: '+d.toLowerCase()+'.',
    (w,d)=>'In English, <b class="sw">'+w+'</b> refers to '+d.toLowerCase()+'.',
    (w,d)=>'The term <b class="sw">'+w+'</b>: '+d+'.',
  ];
  const rows=TW.map((w,i)=>'<div class="sc">'
    +'<div class="se" style="display:flex;gap:8px">'
    +'<span style="color:var(--hint);min-width:20px">'+(i+1)+'.</span>'
    +'<span>'+T[i%T.length](w.w,w.d)+'</span>'
    +'<button class="tbtn" onclick="speakIdx('+i+')">&#128266;</button>'
    +'</div>'
    +'<div class="sk">&#8594; <strong>'+w.w+'</strong>'+(w.p?' ('+w.p+'.)':'')+': '+(w.k||w.d)+'</div>'
    +'</div>').join('');
  set$('<div class="card"><div class="slabel" style="color:var(--gold)">&#128218; 4단계 — 예문 + 한글 해석</div>'
    +'<p style="font-size:13px;color:var(--muted);margin-bottom:1rem">&#128266; 버튼으로 발음을 확인하세요!</p>'
    +rows
    +'<div class="brow" style="margin-top:1rem">'
    +'<button class="btn bs" onclick="speakAllEx()">&#9654; 전체읽기</button>'
    +'<button class="btn bg" onclick="finishAll()">&#127881; 학습 완료!</button>'
    +'</div></div>');
  document.getElementById('prog-wrap').style.display='none';
}
function speakIdx(i){
  if(!window.speechSynthesis)return;
  const w=TW[i];if(!w)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(w.w+'. '+w.d);
  u.lang='en-US';u.rate=0.8;
  const vs=speechSynthesis.getVoices();
  const eng=vs.find(v=>v.lang.startsWith('en'));
  if(eng)u.voice=eng;
  speechSynthesis.speak(u);
}
function speakAllEx(){
  let i=0;
  function next(){
    if(i>=TW.length)return;
    const w=TW[i++];
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(w.w+'. '+w.d);
    u.lang='en-US';u.rate=0.8;
    const vs=speechSynthesis.getVoices();
    const eng=vs.find(v=>v.lang.startsWith('en'));
    if(eng)u.voice=eng;
    u.onend=()=>setTimeout(next,400);
    speechSynthesis.speak(u);
  }
  next();
}

function finishAll(){
  const tot=score.c+score.w,pct=tot>0?Math.round(score.c/tot*100):100;
  const em=pct>=90?'&#127942;':pct>=70?'&#127775;':pct>=50?'&#128170;':'&#128218;';
  set$('<div class="card" style="text-align:center">'
    +'<div style="font-size:60px;margin-bottom:1rem">'+em+'</div>'
    +'<div style="font-family:Georgia,serif;font-size:24px;color:var(--gold2);margin-bottom:.5rem">학습 완료!</div>'
    +'<p style="color:var(--muted);font-size:14px;margin-bottom:1.25rem">수고하셨습니다!</p>'
    +'<div class="srow" style="margin-bottom:1.25rem">'
    +'<div class="sbadge hi">&#9989; '+score.c+'</div>'
    +'<div class="sbadge lo">&#10060; '+score.w+'</div>'
    +'<div class="sbadge '+(pct>=70?'hi':'lo')+'">&#128202; '+pct+'%</div>'
    +'</div>'
    +(missed.length>0?'<div class="ml"><h4>&#128257; 다시연습 ('+missed.length+'개)</h4>'
      +missed.map(w=>'<div class="mli"><span class="mliw">'+w.w+'</span><span class="mlid">'+w.d.slice(0,40)+'</span></div>').join('')+'</div>'
      :'<p style="color:var(--green);font-size:14px;margin-bottom:1rem">&#127881; 완벽 마스터!</p>')
    +'<div class="brow">'
    +'<button class="btn bs" onclick="switchView(\'home\')">&#127968; 홈</button>'
    +'<button class="btn bg" onclick="switchView(\'home\')">&#128260; 새단어!</button>'
    +'</div></div>');
  document.getElementById('stage-bar').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
}

function showMemo(){
  document.getElementById('stage-bar').style.display='none';
  document.getElementById('prog-wrap').style.display='none';
  if(!MEMORIZED.length){
    set$('<div class="card" style="text-align:center;padding:2.5rem">'
      +'<div style="font-size:48px;margin-bottom:1rem">&#128219;</div>'
      +'<div style="font-family:Georgia,serif;font-size:20px;color:var(--gold2)">암기 완료 목록이 비어있습니다</div>'
      +'</div>');return;
  }
  const list=MEMORIZED.map((w,i)=>'<div class="mem-item">'
    +'<span class="miw">'+w.w+'</span>'
    +'<span class="mip">'+(w.p?'('+w.p+'.)':'')+'</span>'
    +'<span class="mid">'+(w.k||w.d.slice(0,40))+'</span>'
    +'<button class="mi-del" onclick="delMem('+i+')">&#10005;</button>'
    +'</div>').join('');
  set$('<div class="card">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">'
    +'<div style="font-family:Georgia,serif;font-size:18px;color:var(--gold2)">&#9989; 암기완료 ('+MEMORIZED.length+'개)</div>'
    +'<button class="btn bs" onclick="exportWord()" style="padding:7px 14px;font-size:12px">&#128196; 내보내기</button>'
    +'</div>'
    +'<div class="mem-list">'+list+'</div>'
    +'<div class="brow" style="margin-top:1rem">'
    +'<button class="btn bs" onclick="if(confirm(\'전체 삭제?\')){MEMORIZED=[];saveMem();showMemo();}">&#128465; 전체삭제</button>'
    +'<button class="btn bg" onclick="exportWord()">&#128196; Word 내보내기</button>'
    +'</div></div>');
}

function delMem(i){MEMORIZED.splice(i,1);saveMem();showMemo();}

function exportWord(){
  const rows=MEMORIZED.map((w,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+w.w+'</b></td><td>'+(w.p||'')+'</td><td>'+(w.k||'')+'</td><td>'+w.d+'</td><td>'+(w.date||'')+'</td></tr>').join('');
  const h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>암기완료 단어</title>'
    +'<style>body{font-family:Arial;padding:20px;}table{width:100%;border-collapse:collapse;}th{background:#1a1a2e;color:#D4A843;padding:8px;}td{padding:7px;border-bottom:1px solid #eee;}@media print{button{display:none;}}</style>'
    +'</head><body><h2>암기완료 단어 ('+MEMORIZED.length+'개)</h2>'
    +'<table><thead><tr><th>#</th><th>단어</th><th>품사</th><th>한국어</th><th>영어정의</th><th>날짜</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<br><button onclick="window.print()" style="padding:10px 24px;background:#1a1a2e;color:#D4A843;border:none;border-radius:6px;cursor:pointer;font-size:14px">&#128424; 프린트</button>'
    +'</body></html>';
  const b=new Blob([h],{type:'text/html;charset=utf-8'});
  const win=window.open(URL.createObjectURL(b),'_blank');
  if(win)setTimeout(()=>win.print(),800);
}

function addMissed(w){if(!missed.find(m=>m.w===w.w))missed.push(w);}
function setFB(ok,ans,msg){
  const el=document.getElementById('fb');if(!el)return;
  el.className='fb '+(ok?'ok':'err');
  el.textContent=ok?['정답! &#127881;','맞아요!','완벽!','훌륭해요!'][Math.floor(Math.random()*4)]:(msg||'틀렸습니다. 정답: '+ans);
}
function showCombo(){
  const d=document.createElement('div');d.className='cbadge';
  d.textContent='&#128293; '+combo+'연속 정답!';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1800);
}
function nextQ(){
  answered=false;qIdx++;
  if(qIdx>=TW.length){
    stageDone[stage]=true;document.getElementById('sb'+stage).classList.add('done');
    if(stage<3){
      const next=stage+1;
      const L=['','&#128269; 2단계: 정의&#8594;단어','&#9999; 3단계: 직접입력','&#128218; 4단계: 예문읽기'];
      const D=['','정의를 보고 단어를 선택!','단어를 직접 입력!','예문을 읽고 발음 확인!'];
      document.getElementById('prog-wrap').style.display='none';
      set$('<div class="card" style="text-align:center;padding:2rem">'
        +'<div style="font-size:48px;margin-bottom:1rem">'+['','&#128269;','&#9999;','&#128218;'][next]+'</div>'
        +'<div style="font-family:Georgia,serif;font-size:22px;color:var(--gold2);margin-bottom:.5rem">'+L[next]+'</div>'
        +'<p style="font-size:14px;color:var(--muted);margin-bottom:1.5rem">'+D[next]+'</p>'
        +'<button class="btn bg" style="padding:14px 32px;font-size:16px" onclick="startStage('+next+')">시작! &#8594;</button>'
        +'</div>');
    } else finishAll();
  } else renderQ();
}

showHome();
</script>
</body>
</html>
